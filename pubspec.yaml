name: e_commerce
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

#packages
dependencies:
  flutter:
    sdk: flutter

#Utility packages
  
  http: ^1.6.0
  intl: ^0.20.2
  logger: ^2.6.2
  url_launcher: ^6.3.2

#  State management
  get: ^4.7.3
  get_storage: ^2.1.1
  
#  Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  smooth_page_indicator: ^2.0.1
  lottie: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

#Local assets
  assets:
    - assets/
    - assets/images/
    - assets/logos/
    - assets/icons/
    - assets/images/on_boarding_images/
    - assets/images/animations/

  fonts:
  - family: "poppins"
    fonts:
      - asset: assets/fonts/poppins_bold.ttf
        weight: 800
      - asset: assets/fonts/poppins_italic.ttf
        style: italic
      - asset: assets/fonts/poppins_light.ttf
        weight: 300
      - asset: assets/fonts/poppins_medium.ttf
        weight: 500
      - asset: assets/fonts/poppins_mediumitalic.ttf
        weight: 500
        style: italic
      - asset: assets/fonts/poppins_regular.ttf
        weight: 400
      - asset: assets/fonts/poppins_semibold.ttf
        weight: 600

  
  
  
  

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
