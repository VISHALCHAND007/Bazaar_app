name: e_commerce
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

#packages
dependencies:
  flutter:
    sdk: flutter

#Utility packages
  
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8
  get: ^4.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

#Local assets
assets:
  - assets/images/
  - assets/logos/
  - assets/icons

fonts:
  - family:
    fonts:
      - asset: assets/fonts/poppins_bold.ttf
        weight: 800
      - asset: assets/fonts/poppins_italic.ttf
        style: italic
      - asset: assets/fonts/poppins_light.ttf
        weight: 300
      - asset: assets/fonts/poppins_medium.ttf
        weight: 500
      - asset: assets/fonts/poppins_mediumitalic.ttf
        weight: 500
        style: italic
      - asset: assets/fonts/poppins_regular.ttf
        weight: 400
      - asset: assets/fonts/poppins_semibold.ttf
        weight: 600

  
  
  
  

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
